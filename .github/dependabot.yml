version: 2
updates:
  # Backend npm dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Stellar Wave"
    commit-message:
      prefix: "chore(backend-deps)"
    open-pull-requests-limit: 5

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Stellar Wave"
    commit-message:
      prefix: "chore(frontend-deps)"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/engines"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/adapter-neon"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Soroban contract Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "contract"
      - "Stellar Wave"
    commit-message:
      prefix: "chore(contract-deps)"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "Stellar Wave"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
