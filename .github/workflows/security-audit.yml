name: Dependency Security Audit

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6 AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  npm-audit-backend:
    name: npm audit (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Show full audit report
        run: npm audit --json || true
        working-directory: backend
      - name: Fail on critical vulnerabilities only
        # We use 'critical' because some high-severity advisories exist in
        # transitive dependencies of @stellar/stellar-sdk with no upstream fix yet.
        # Tracked in: https://github.com/thisisouvik/autopilot/issues/10
        run: npm audit --audit-level=critical --omit=dev
        working-directory: backend

  npm-audit-frontend:
    name: npm audit (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Show full audit report
        run: npm audit --json || true
        working-directory: frontend
      - name: Fail on critical vulnerabilities only
        # We use 'critical' because some high-severity advisories exist in
        # transitive dependencies of @stellar/stellar-sdk with no upstream fix yet.
        # Tracked in: https://github.com/thisisouvik/autopilot/issues/10
        run: npm audit --audit-level=critical --omit=dev
        working-directory: frontend

  cargo-audit:
    name: cargo audit (Contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: contracts
