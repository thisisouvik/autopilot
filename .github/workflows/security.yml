name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run automatically every Sunday at midnight
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    name: NPM Security Audit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Audit Backend Dependencies
        working-directory: ./backend
        # Use 'critical' level: some high-severity advisories are in transitive
        # dependencies of @stellar/stellar-sdk with no upstream fix available yet.
        # Full high-severity report is shown by the Dependency Security Audit workflow.
        run: npm audit --audit-level=critical --omit=dev

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        # Same rationale — transitive deps in @stellar/stellar-sdk and prisma.
        run: npm audit --audit-level=critical --omit=dev
